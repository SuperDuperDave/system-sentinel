[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "system-sentinel"
version = "1.1.0"
description = "A stethoscope for a Windows computer: the machine's own record, in one place, for a person and for a local agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "mcp>=2,<3",
    "segno>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
launcher = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
system-sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["static/**/*", "tools/DecodeWheaRecord/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "host: runs against the real Windows host through powershell.exe (skipped when the bridge is absent)",
]
addopts = "-q"
