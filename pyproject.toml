[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "system-sentinel"
version = "1.3.0"
description = "A stethoscope for a Windows computer: the machine's own record, in one place, for a person and for a local agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "mcp>=2,<3",
    "segno>=1.6",
]

[project.optional-dependencies]
# Everything the checks need and nothing the tool ships with: this is one executable, and a
# dependency added here never reaches a person's machine.
test = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]
launcher = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
system-sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["static/**/*", "tools/DecodeWheaRecord/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "host: runs against the real Windows host through powershell.exe (skipped when the bridge is absent)",
]
addopts = "-q"

[tool.ruff]
# The code here favours one long, plain sentence over three short ones, in prose and in source
# alike. The length below is what it aims for, not a rule that fails a build: E501 is deliberately
# left out of the selection. What is selected is what changes meaning — a name that is not defined,
# an import that is not used, a comparison that does not do what it reads like.
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # the pycodestyle errors that are errors, not opinions
    "F",              # pyflakes: undefined names, unused imports, broken f-strings
    "I",              # one import order, decided once
    "UP",             # the language this project actually targets
    "B",              # bugbear: the shapes that are usually a defect
]

[tool.mypy]
# Strict at the boundary, silent behind it. These files are where a wrong type leaves the
# process: the bridge to Windows, the envelope every reading comes back in, redaction and exact
# JSON encoding before anything is served, the token, and the routes. The readings behind them are checked by the
# suite against real payloads, which is the stronger check for code whose input is Windows' JSON.
python_version = "3.11"
strict = true
files = ["sentinel/bridge.py", "sentinel/reading.py", "sentinel/service.py", "sentinel/redact.py", "sentinel/serialization.py", "sentinel/auth.py", "sentinel/app.py", "sentinel/readings/changes.py", "sentinel/readings/event_coverage.py"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# Third parties that ship no types. Their surface here is small and the suite exercises all of it.
module = ["pystray.*", "segno.*", "mcp.*", "PIL.*"]
ignore_missing_imports = true
