name: Checks

# Two machines, because the tool reads one of them. Linux takes the unit suite through the fake
# bridge and builds the dashboard; the Windows runner is the part this project had no way to get
# on its own: a Windows machine that is not David's, where the host tests read a real event log
# through a real powershell.exe and the executable is built the way a person would build it.

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Unit suite and dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Every version and every file, fixed: requirements.lock carries a hash for each one and pip
      # refuses anything that does not match. When a dependency moves, regenerate it with the
      # command its own header states (pip-compile, from pip-tools, on the Python version this job
      # pins; the tool is not in the test extra because nothing here regenerates the lock, it only
      # installs from it). The project itself goes in after, without resolution and without a build
      # isolation that would fetch an unpinned backend.
      - name: Install the locked dependencies, hashes checked
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation

      # The one thing a lock beside a pyproject can get wrong: drifting out of the range the
      # project declares. This says the two still agree, which is what makes a widened range in
      # pyproject.toml mean something without a regenerated lock beside it.
      - name: The lock still satisfies what the project asks for
        run: python -m pip check

      # The repository is public. A hostname on a private network, a user's home path or a Windows
      # profile path in a committed file is a leak the working agreement forbids, and a rule nobody
      # is prompted to follow will not hold, so this holds it. The patterns are the shapes such
      # things take, not a list of David's own. tests/ is left out: its fixtures carry made-up
      # names (tester, someone, example) on purpose, because the redaction has to be shown removing them.
      - name: Nothing committed names a host, a user or a local path
        run: |
          if git grep -nE '[a-z0-9-]+\.ts\.net|C:\\Users\\[A-Za-z]|/home/[a-z][a-z0-9_-]*/' -- . ':!.github/workflows/ci.yml' ':!tests/'; then
            echo 'a committed file carries a hostname, a user name or a local path; see the lines above'
            exit 1
          fi
          echo 'no hostname, user name or local path in tracked files'

      # From here every step runs even after one fails: a reviewer should get the whole verdict from
      # one run — what lint found, what the types found, what the suite found — not the first thing
      # that went wrong.
      - name: Lint
        if: ${{ !cancelled() }}
        run: python -m ruff check --output-format=github sentinel tests

      - name: Types at the boundary
        if: ${{ !cancelled() }}
        run: python -m mypy

      - name: The suite without the host tests, with coverage
        if: ${{ !cancelled() }}
        run: python -m pytest -m "not host" --cov=sentinel --cov-report=term-missing:skip-covered

      # Printed, never gated. The number left out of it is the part only a Windows machine can run,
      # so a threshold here would measure the runner rather than the tool.
      - name: Coverage, in the run's own summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage"
            echo
            echo "Line coverage on this runner: $(python -m coverage report --format=total)%."
            echo "The host tests, which read a real Windows machine, are not in this number."
            echo
            python -m coverage report --format=markdown --sort=cover | head -30
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The dashboard lints, type-checks and builds
        if: ${{ !cancelled() }}
        working-directory: dashboard
        run: npm ci && npm run lint && npm run build

      - name: What the dependencies are known to be vulnerable to
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
        working-directory: dashboard

      # In a virtual environment of its own, so the scanner's own dependencies cannot displace a
      # locked one in the environment the suite just ran in. It reads the lock, which is the whole
      # set including anything this runner had no reason to install.
      - name: The same question of the Python dependencies
        if: ${{ !cancelled() }}
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet pip-audit==2.10.1
          /tmp/audit/bin/pip-audit --require-hashes --requirement requirements.lock --strict

  windows:
    name: Full suite and the executable
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Before the suite, because sentinel/static is not in the repository and build.ps1 would
      # otherwise build it in the middle of the executable step.
      - name: The dashboard type-checks and builds
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Install the package, its test extra and the tray
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,launcher]"

      # tests/test_bridge.py is left out here, and only here: its fake powershell.exe is a
      # Python script made executable by its mode bit, which Windows cannot run at all
      # ("[WinError 216] This version of %1 is not compatible"). That file exercises the
      # bridge's own parsing, which has nothing Windows-specific in it, and the Linux job
      # runs it whole. Everything else runs here, host tests included.
      - name: The whole suite, host tests included
        run: python -m pytest --ignore=tests/test_bridge.py

      # From here the steps run even after a failure above: one run should say whether the
      # machine answered AND whether the executable builds, not only which came first.
      - name: The health reading on this runner
        if: ${{ !cancelled() }}
        shell: pwsh
        run: system-sentinel check

      - name: The executable
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          build\windows\build.ps1 -Python $python

      - name: Keep the executable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SystemSentinel-${{ github.sha }}
          path: dist/SystemSentinel.exe
          if-no-files-found: error
          retention-days: 7
