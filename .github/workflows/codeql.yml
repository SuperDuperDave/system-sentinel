name: CodeQL

# The other half of the check suite: the one that reads the code for the shapes that become
# vulnerabilities rather than for the behaviour the tests pin down. Three languages, because this
# repository is three things — the Python that reads the machine, the TypeScript that shows it, and
# the workflows that build and release it, which are code with credentials in reach.
#
# Findings land in the repository's Security tab, not in a failing job: an alert is a lead to read,
# and the suite is where behaviour is decided. The schedule is what makes it worth having — a query
# pack learns about a pattern months after the code was written, and nobody pushes on a Monday
# morning to find out.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing is compiled here, so nothing is built: the databases are made from the source as it
      # stands. security-and-quality rather than the security pack alone, because a reading that is
      # wrong is as bad for this tool as a reading that is unsafe.
      - name: Make the database
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Ask it the questions
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
