<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1A16" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A stethoscope for your computer. The machine's own record, in one place, for you and for your agent." />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="apple-touch-icon" href="/mark-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>System Sentinel</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* The appearance a person chose, applied before first paint; the system preference otherwise. */
      try { var t = localStorage.getItem('sentinel.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
